name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore MathDeck.sln
      - run: dotnet build MathDeck.sln --no-restore -c Release
      - run: dotnet test MathDeck.sln --no-build -c Release